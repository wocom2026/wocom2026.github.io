<style>
  :root{--bg:#35152E;--ink:#F6F0F3;--soft:#CDB9C6;--copper:#B8734F}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;padding-inline:clamp(16px,6vw,64px);min-height:100%}
  main{flex:1;max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:48px}
  footer{max-width:760px;width:100%;margin:0 auto;padding-block:26px 30px;border-top:1px solid rgba(246,240,243,.14);color:var(--soft)}
  footer .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 28px;margin:0}
  footer .grid div{display:flex;flex-direction:column;gap:6px;min-width:0}
  footer dt{letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--copper);font-weight:500}
  footer dd{margin:0;font-size:15px;line-height:1.5;color:var(--ink)}
  footer .reg{margin:20px 0 0;padding-top:14px;border-top:1px solid rgba(246,240,243,.08);font-size:12.5px;line-height:1.5;color:var(--soft);opacity:.8;max-width:none;overflow-wrap:anywhere}
  footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(184,115,79,.6)}
  footer a:hover,footer a:focus-visible{color:var(--copper)}
  footer a:focus-visible{outline:2px solid var(--copper);outline-offset:3px}
  footer .grid{grid-template-columns:repeat(3,auto);justify-content:space-between}
  @media (min-width:781px){footer dd{white-space:nowrap}}
  footer dd .sm{font-size:13px;color:var(--soft)}
  footer dd .nw{white-space:nowrap}
  @media (max-width:780px){footer .grid{grid-template-columns:repeat(2,minmax(0,1fr));justify-content:stretch}}
  @media (max-width:380px){footer .grid{grid-template-columns:1fr}}
  h1{margin:0;display:flex;align-items:flex-end;gap:.28em;flex-wrap:wrap;font-size:clamp(34px,7.5vw,76px);line-height:1}
  h1 .mark{height:.98em;width:auto;display:block}
  h1 .mark .wo{fill:var(--copper)} h1 .mark .com{fill:var(--ink)}
  h1 .sro{font-family:"Michroma","Eurostile Extended",system-ui,sans-serif;font-weight:400;font-size:.62em;color:var(--copper);-webkit-text-stroke:.035em var(--copper);letter-spacing:.02em;line-height:1;padding-bottom:.02em}
  p{margin:0;font-size:clamp(18px,2.6vw,24px);line-height:1.45;color:var(--soft);max-width:34ch}
  .rule{width:56px;height:2px;background:var(--copper);border:0;margin:6px 0 0}
</style>
